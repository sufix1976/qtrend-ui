name: Add R1-R4 research markers

on:
  push:
    paths:
      - '.github/workflows/add-r1-r4-research-markers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch CockpitV2 research markers only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/CockpitV2.tsx')
          s=p.read_text()
          old='type ResearchResult={version:number;mode:"RESEARCH";symbol:string;generated_at:number;duration_ms:number;view_tf:string;base_candle_count:number;profile:any;chart_candles:Candle[];entry_rows:any[];exit_rows:any[];candidate_exit_rows:any[];channel_rows:any[];controller_rows:any[];channel_line:any[];squeeze_points:SqueezePoint[];lrc_points:Point[];fisher_points:Point[];rsi_exit_points:Point[];backtest:BacktestStats&{closedTrades?:any[]};latest_controller:any};'
          new='type ResearchResult={version:number;mode:"RESEARCH";symbol:string;generated_at:number;duration_ms:number;view_tf:string;base_candle_count:number;profile:any;chart_candles:Candle[];entry_rows:any[];exit_rows:any[];candidate_exit_rows:any[];reverse_entry_research_rows:any[];channel_rows:any[];controller_rows:any[];channel_line:any[];squeeze_points:SqueezePoint[];lrc_points:Point[];fisher_points:Point[];rsi_exit_points:Point[];backtest:BacktestStats&{closedTrades?:any[]};latest_controller:any};'
          if old not in s: raise SystemExit('ResearchResult anchor not found')
          s=s.replace(old,new,1)
          old2='}if(controllerCfg.showMarkers)for(const r of research?.controller_rows||[])'
          insert='}for(const r of research?.reverse_entry_research_rows||[]){const time=Math.floor((Number(r.time)-1)/sec)*sec;if(!chartTimes.has(time))continue;const isLong=String(r.entry||"").toUpperCase()==="LONG";const label=String(r.label||`${String(r.research_id||"R?")} ${isLong?"L":"S"}`);markers.push({time:time as Time,position:isLong?"belowBar":"aboveBar",color:isLong?"#a3e635":"#f472b6",shape:isLong?"arrowUp":"arrowDown",text:label,size:1.7});}if(controllerCfg.showMarkers)for(const r of research?.controller_rows||[])'
          if old2 not in s: raise SystemExit('marker anchor not found')
          s=s.replace(old2,insert,1)
          old3='},[research?.exit_rows,research?.controller_rows,executionMarks,candles,interval,exitCfg.showMarkers,controllerCfg.showMarkers]);'
          new3='},[research?.exit_rows,research?.reverse_entry_research_rows,research?.controller_rows,executionMarks,candles,interval,exitCfg.showMarkers,controllerCfg.showMarkers]);'
          if old3 not in s: raise SystemExit('marker dependency anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit verified UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CockpitV2.tsx
          git commit -m "research: show isolated R1-R4 reverse-entry markers"
          git push
